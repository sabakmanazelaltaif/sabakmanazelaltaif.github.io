<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجز سباك - منازل الطائف ابو مهند</title>
<style>
body{font-family:tahoma;background:#f5f5f5;margin:0;padding:15px}
.box{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 2px 10px #0002}
h2{color:#0d5c36;text-align:center}
select,input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:16px;background:#25D366;color:#fff;border:0;border-radius:10px;font-size:19px;font-weight:bold;margin-top:10px}
small{color:#666;display:block;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>🔧 حجز سباك منازل الطائف<br>ابو مهند 0546691380</h2>
<label>نوع الخدمة:</label>
<select id="s">
<option>كشف تسريب مياه</option>
<option>تأسيس سباكة</option>
<option>تسليك مجاري</option>
<option>صيانة حمامات ومطابخ</option>
<option>تركيب سخان / مضخة</option>
</select>
<label>الحي:</label>
<select id="a">
<option>الوشحاء</option><option>الحوية</option><option>شهار</option>
<option>قروى</option><option>الشهداء</option><option>الوسام</option>
<option>السداد</option><option>حي آخر</option>
</select>
<label>رقم جوالك:</label>
<input id="p" type="tel" placeholder="05xxxxxxxx">
<button onclick="go()">احجز الآن عبر واتساب</button>
<small>سيتم تحويلك لواتساب مباشرة لتأكيد الحجز</small>
</div>
<script>
function go(){
let s=document.getElementById('s').value;
let a=document.getElementById('a').value;
let p=document.getElementById('p').value;
let m=`السلام عليكم ابو مهند%0Aابغى حجز:%0A🔧 الخدمة: ${s}%0A📍 الحي: ${a}%0A📱 رقمي: ${p}`;
window.open('https://wa.me/966546691380?text='+m,'_blank');
}
</script>
</body>
</html>
